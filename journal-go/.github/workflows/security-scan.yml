name: Scan de securite quotidien

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours a 3h UTC
  workflow_dispatch: # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  # ---------- Re-scan de l'image deja deployee ----------
  # Utile car de nouvelles vulnerabilites sont decouvertes en continu, meme
  # dans du code qui n'a pas change depuis son dernier build.
  scan-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Nom d'image en minuscules
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Scan de l'image "latest" actuellement en production (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Publie les resultats dans l'onglet Security de GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ---------- Etat du serveur (VPS) ----------
  scan-server:
    runs-on: ubuntu-latest
    steps:
      - name: Mises a jour de securite en attente sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2222
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo apt update -qq
            UPDATES=$(apt list --upgradable 2>/dev/null | grep -ic security || true)
            echo "Mises a jour de securite en attente : $UPDATES"
            if [ "$UPDATES" -gt 0 ]; then
              echo "::error::$UPDATES mise(s) a jour de securite en attente sur le VPS. Connecte-toi et lance : sudo apt update && sudo apt upgrade -y"
              exit 1
            fi

      - name: Detecte les ports ouverts inattendus (nmap)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y nmap
          OPEN=$(nmap -Pn "${{ secrets.VPS_HOST }}" -p- --open -T4 | grep "^[0-9]*/tcp" || true)
          echo "Ports ouverts detectes :"
          echo "$OPEN"
          UNEXPECTED=$(echo "$OPEN" | grep -vE "^(2222|8000)/tcp" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Port(s) ouverts inattendus sur le VPS :"
            echo "$UNEXPECTED"
            exit 1
          fi
