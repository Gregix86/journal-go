name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------- CI : compilation + analyses statiques (SAST, secrets, IaC, SCA) ----------
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, necessaire pour gitleaks

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt (verifie le formatage)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Fichiers mal formates :"
            echo "$UNFORMATTED"
            echo "--- diff exact attendu par gofmt ---"
            gofmt -d .
            exit 1
          fi

      - name: govulncheck (SCA - vulnerabilites connues dans le code/dependances Go)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec (SAST - failles dans notre propre code)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./... || true
          gosec ./...

      - name: Publie les resultats gosec dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: gitleaks (secrets scanning - mots de passe/cles oublies dans Git)
        run: |
          LATEST=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f4 | sed 's/^v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${LATEST}/gitleaks_${LATEST}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --verbose --redact

      - name: Installe Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # v0.2.6, epingle par hash (cf. compromission mars 2026)

      - name: Genere le SARIF (ne bloque jamais - juste pour l'onglet Security)
        run: trivy config . --severity CRITICAL,HIGH --format sarif --output trivy-config.sarif --exit-code 0

      - name: Publie les resultats Trivy config dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config (IaC - Dockerfile / docker-compose mal configures)
        run: trivy config . --severity CRITICAL,HIGH --exit-code 1

  # ---------- Build : construit l'image Docker, la pousse, et scan SCA/conteneur ----------
  build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules (Docker l'exige)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Connexion a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan de vulnerabilites de l'image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Publie les resultats Trivy image dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ---------- DAST : attaque le site en conditions reelles (isole, pas la prod) ----------
  dast-scan:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Demarre une instance jetable de l'app pour le scan
        run: |
          cat > .env <<EOF
          SECRET_KEY=ci-scan-secret
          SITE_NAME=Scan CI
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=ci-scan-password-temp
          EOF
          sed "s#image: ghcr.io/.*#image: ${{ env.IMAGE_NAME }}:${{ github.sha }}#" docker-compose.prod.yml > docker-compose.ci.yml
          docker compose -f docker-compose.ci.yml up -d || {
            echo "::error::echec du demarrage, logs des conteneurs :"
            docker compose -f docker-compose.ci.yml logs
            exit 1
          }
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ && break
            sleep 2
          done

      - name: OWASP ZAP baseline scan (DAST)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8000/"
          cmd_options: "-c .zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false

      - name: Arrete l'instance jetable
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ---------- Deploy : connexion SSH vers ton VPS ----------
  deploy:
    needs: [build-and-push, dast-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploiement via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2222
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/journal-go
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
